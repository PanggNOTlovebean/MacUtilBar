<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>搜索面板</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#0058B8}a:hover{color:#003F85}
</style>
</helmet>
<div style="width: 600px; height: 520px; box-sizing: border-box; padding: 24px; background: #E9ECF3; font-family: -apple-system, 'SF Pro Text', 'PingFang SC', Inter, sans-serif; color: #1D1D1F">
<div style="background: #FFFFFF; border-radius: 12px; box-shadow: 0 0 0 1px rgba(0,0,0,0.08), 0 18px 44px rgba(20,30,60,0.16); display: flex; flex-direction: column; overflow: hidden">
<div style="display: flex; align-items: center; gap: 10px; padding: 16px 18px 6px">
<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="#6E6E73" stroke-width="1.5" aria-hidden="true"><circle cx="6" cy="6" r="4.5"></circle><path d="M9.5 9.5 L13 13" stroke-linecap="round"></path></svg>
<label style="flex: 1; font-size: 18px">s<span style="border-left: 2px solid #0A64D8; margin-left: 1px"></span></label>
<span style="font-size: 12px; color: #5E5E63">4 个图标</span>
</div>
<div style="display: flex; gap: 26px; padding: 8px 18px 0; border-bottom: 1px solid rgba(0,0,0,0.08); font-size: 13px">
<span style="padding-bottom: 8px; color: #0A64D8; font-weight: 600; border-bottom: 2px solid #0A64D8">全部</span>
<span style="padding-bottom: 8px; color: #48484A">常显</span>
<span style="padding-bottom: 8px; color: #48484A">隐藏</span>
<span style="padding-bottom: 8px; color: #48484A">永久隐藏</span>
</div>
<div style="padding: 8px; display: flex; flex-direction: column; gap: 2px">
<div style="height: 36px; display: flex; align-items: center; gap: 10px; padding: 0 10px; border-radius: 7px; background: #0A64D8; color: #FFFFFF;"><span style="width: 22px; height: 22px; border-radius: 6px; background: #5E5CE6; color: #FFFFFF; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex: none" aria-hidden="true">S</span><span style="font-size: 13px"><mark style="background: #FFE58A; color: inherit; border-radius: 2px">S</mark>potify</span><span style="font-size: 12px; color: rgba(255,255,255,0.80); flex: 1">正在播放</span><span style="font-size: 11px; padding: 1px 7px; border-radius: 4px; background: rgba(255,255,255,0.22); color: #FFFFFF">隐藏</span></div>
<div style="height: 36px; display: flex; align-items: center; gap: 10px; padding: 0 10px; border-radius: 7px; background: #F0F0F2;"><span style="width: 22px; height: 22px; border-radius: 6px; background: #2F80ED; color: #FFFFFF; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex: none" aria-hidden="true">D</span><span style="font-size: 13px">Dropbox</span><span style="font-size: 12px; color: #5E5E63; flex: 1">已同步 · <mark style="background: #FFE58A; color: inherit; border-radius: 2px">S</mark>ync</span></div>
<div style="height: 36px; display: flex; align-items: center; gap: 10px; padding: 0 10px; border-radius: 7px; "><span style="width: 22px; height: 22px; border-radius: 6px; background: #8E8E93; color: #FFFFFF; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex: none" aria-hidden="true">⚙</span><span style="font-size: 13px">Sound</span><span style="font-size: 12px; color: #5E5E63; flex: 1"><mark style="background: #FFE58A; color: inherit; border-radius: 2px">S</mark>ystem · 控制中心</span></div>
<div style="height: 36px; display: flex; align-items: center; gap: 10px; padding: 0 10px; border-radius: 7px; "><span style="width: 22px; height: 22px; border-radius: 6px; background: #34C759; color: #FFFFFF; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex: none" aria-hidden="true">W</span><span style="font-size: 13px">微信</span><span style="font-size: 12px; color: #5E5E63; flex: 1">状态 · <mark style="background: #FFE58A; color: inherit; border-radius: 2px">S</mark>tatus</span><span style="font-size: 11px; padding: 1px 7px; border-radius: 4px; background: #EDEDF0; color: #3A3A3C">永久</span></div>
</div>
<div style="height: 120px"></div>
<div style="display: flex; align-items: center; gap: 16px; padding: 10px 18px; border-top: 1px solid rgba(0,0,0,0.08); font-size: 12px; color: #5E5E63">
<span><span style="padding: 1px 6px; border-radius: 4px; box-shadow: 0 0 0 1px rgba(0,0,0,0.18)">↩</span> 打开</span>
<span><span style="padding: 1px 6px; border-radius: 4px; box-shadow: 0 0 0 1px rgba(0,0,0,0.18)">⌥↩</span> 显示所在分区</span>
<span><span style="padding: 1px 6px; border-radius: 4px; box-shadow: 0 0 0 1px rgba(0,0,0,0.18)">⎋</span> 关闭</span>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":600,"height":520}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
